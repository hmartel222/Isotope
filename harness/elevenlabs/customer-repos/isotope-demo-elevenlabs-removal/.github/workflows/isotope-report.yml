name: Isotope report
on:
  workflow_run:
    workflows: ["Isotope verify"]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
jobs:
  report:
    if: "${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: isotope-report
          path: .isotope
          run-id: "${{ github.event.workflow_run.id }}"
          github-token: "${{ github.token }}"
      - uses: hmartel222/hophacksf26/action@6735f4f681b20b27d2ba4b36f22cecb89ccab477
        with:
          mode: report
          artifact-root: .isotope
          base: "${{ github.event.workflow_run.pull_requests[0].base.sha }}"
          head: "${{ github.event.workflow_run.pull_requests[0].head.sha }}"
          pr-number: "${{ github.event.workflow_run.pull_requests[0].number }}"
          github-token: "${{ github.token }}"
          reasoner: off
          repair: off
