# Explicit Phase 2 config. JSON is a YAML 1.2 subset.
{
  "version": 1,
  "language": "ts",
  "entryPoints": [
    {
      "file": "src/webhook.ts",
      "export": "handler",
      "kind": "express_route"
    }
  ],
  "mocks": [
    {
      "module": "src/db.ts",
      "exports": {
        "db": "recordAll"
